name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug files
        run: |
          echo "=== pwd ==="
          pwd
          echo "=== ls -la ==="
          ls -la
          echo "=== ls -la Sources ==="
          ls -la Sources || true
          echo "=== cat project.yml ==="
          cat project.yml
          echo "=== hexdump project.yml ==="
          hexdump -C project.yml | head -20
          echo "=== xcodegen version ==="
          xcodegen version || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (no signing)
        run: |
          xcodebuild archive \
            -scheme MyApp \
            -sdk iphoneos \
            -archivePath build/MyApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/MyApp.xcarchive/Products/Applications/MyApp.app build/Payload/
          cd build && zip -r MyApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyApp.ipa
          path: build/MyApp.ipa
