name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify files
        run: |
          echo "=== root ==="
          ls -la
          echo "=== Sources ==="
          ls -la Sources
          echo "=== project.yml raw ==="
          cat -vet project.yml

      - name: Install XcodeGen 2.35.0
        run: |
          set -e
          curl -L --fail -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.35.0/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          /tmp/xcodegen/bin/xcodegen --version

      - name: Generate Xcode project
        run: /tmp/xcodegen/bin/xcodegen generate

      - name: Build archive
        run: |
          set -e
          xcodebuild -project MyApp.xcodeproj \
            -scheme MyApp \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MyApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package IPA
        run: |
          set -e
          ls -R build/MyApp.xcarchive/Products/Applications/
          mkdir -p build/Payload
          cp -r build/MyApp.xcarchive/Products/Applications/MyApp.app build/Payload/
          cd build && zip -r MyApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyApp.ipa
          path: build/MyApp.ipa
