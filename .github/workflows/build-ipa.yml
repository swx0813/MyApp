name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify files
        run: |
          echo "=== root ==="
          ls -la
          echo "=== Sources ==="
          ls -la Sources

      - name: Install XcodeGen 2.35.0
        run: |
          set -e
          curl -L --fail -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.35.0/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen_extracted
          XCODEGEN_BIN=$(find /tmp/xcodegen_extracted -name xcodegen -type f | head -1)
          echo "Found xcodegen at: $XCODEGEN_BIN"
          chmod +x "$XCODEGEN_BIN"
          "$XCODEGEN_BIN" --version
          sudo mkdir -p /usr/local/bin
          sudo cp "$XCODEGEN_BIN" /usr/local/bin/xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          set -e
          xcodebuild -project MyApp.xcodeproj \
            -scheme MyApp \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -e
          ls -la build/Release-iphoneos/
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/MyApp.app build/Payload/
          cd build && zip -r MyApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyApp.ipa
          path: build/MyApp.ipa
